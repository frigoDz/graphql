<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <b>GraphQL</b>
      <span id="header-username"></span>
      <button id="logout" hidden>Logout</button>
    </header>

    <form id="login-form">
      <input id="username" type="text" placeholder="Username or email" />
      <input id="password" type="password" placeholder="Password" />
      <button type="submit">Login</button>
      <p id="error"></p>
    </form>

    <section id="profile-section" hidden>
      <div id="top">
        <div>
          <div id="me">
            <div id="card">
              <img id="profile-picture" alt="avatar" />
              <p><span id="name"></span><br />@<span id="login"></span></p>
            </div> 
            <div id="stats">
              <p>Level: <span id="level"></span></p>
              <p>Audit Ratio: <span id="audit-ratio"></span></p>
              <p>Total XP: <span id="xp"></span></p>
              <p>Member Since: <span id="member-since"></span></p>
            </div>
          </div>
          <div id="ani"><img id="cat" src="cat.png" alt="cat"></div>
        </div>
        <svg id="xp-chart" viewBox="0 0 600 300"></svg>
      </div>
      <svg id="skills-chart" viewBox="0 0 600 300"></svg>
    </section>
    <script src="script.js"></script>
  </body>
</html>
